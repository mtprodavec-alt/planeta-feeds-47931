name: Planeta -> PriceCreator nightly sync

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 03:00 Kyiv (winter), 04:00 (summer)
  workflow_dispatch:
    inputs:
      test_ids:
        description: "Test only: space-separated offer ids; feed.xml will contain just these"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      has_new: ${{ steps.newcheck.outputs.has_new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Previous report and new-id list
        run: |
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          curl -fsSL "$base/report.json" -o state.json || echo '{}' > state.json
          curl -fsSL "$base/new_ids.txt" -o prev_new_ids.txt || rm -f prev_new_ids.txt
          curl -fsSL "$base/sale.json" -o prev_sale.json || rm -f prev_sale.json
      - name: Planeta sale page (falls back to the previous list if the site fails)
        run: python tools/parse_sale.py sale.json || { echo "::warning::sale page not parsed, using previous list"; if [ -f prev_sale.json ]; then cp prev_sale.json sale.json; fi; }
      - name: Build feeds
        env:
          PLANETA_FEED_TOKEN: ${{ secrets.PLANETA_FEED_TOKEN || secrets.LANETA_FEED_TOKEN }}
        run: |
          python sync.py --state state.json --site site --sale sale.json
          if [ -f sale.json ]; then cp sale.json site/sale.json; fi
      - name: New products since the previous run?
        id: newcheck
        run: python tools/check_new.py prev_new_ids.txt site/new_ids.txt
      - name: Test mode (small feed.xml)
        if: ${{ github.event.inputs.test_ids != '' && github.event.inputs.test_ids != null }}
        run: |
          python tools/subset_feed.py site/feed.xml site/feed-test.xml ${{ github.event.inputs.test_ids }}
          mv site/feed-test.xml site/feed.xml
      - name: Static test files
        run: if [ -d static ]; then cp -r static/. site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # PriceCreator's auto-update only refreshes price and stock; new cards appear
  # only on an import. Once the new feed is live, start the import of source 34503
  # when the supplier added products since the previous run.
  import:
    needs: [build, deploy]
    if: ${{ needs.build.outputs.has_new == 'true' && (github.event.inputs.test_ids == '' || github.event.inputs.test_ids == null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until the new feed is served
        run: sleep 90
      - name: Start PriceCreator import (source 34503)
        env:
          PRICECREATOR_UUID: ${{ secrets.PRICECREATOR_UUID }}
        run: python tools/start_import.py "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/feed.xml" 47931 34503
