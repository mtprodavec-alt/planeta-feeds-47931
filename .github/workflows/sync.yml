name: Planeta -> PriceCreator nightly sync

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 03:00 Kyiv (winter), 04:00 (summer)
  workflow_dispatch:
    inputs:
      test_ids:
        description: "Test only: space-separated offer ids; feed.xml will contain just these"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Previous report (for the feed shrink check)
        run: curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/report.json" -o state.json || echo '{}' > state.json
      - name: Build feeds
        env:
          PLANETA_FEED_TOKEN: ${{ secrets.PLANETA_FEED_TOKEN || secrets.LANETA_FEED_TOKEN }}
        run: python sync.py --state state.json --site site
      - name: Test mode (small feed.xml)
        if: ${{ github.event.inputs.test_ids != '' && github.event.inputs.test_ids != null }}
        run: |
          python tools/subset_feed.py site/feed.xml site/feed-test.xml ${{ github.event.inputs.test_ids }}
          mv site/feed-test.xml site/feed.xml
      - name: Static test files
        run: if [ -d static ]; then cp -r static/. site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
